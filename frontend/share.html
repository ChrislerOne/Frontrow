<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frontrow · shared list</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/signal.css" />
  <style>
    .wrap{width:100%;max-width:980px;margin:0 auto;padding:0 24px 40px}
    .hero{padding:26px 0 22px}
    .brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .note{margin:14px 0 0;padding-left:14px;border-left:2px solid var(--accent);
          font:400 16px/1.5 var(--prose);color:var(--text)}
    .note cite{display:block;margin-top:5px;font:400 11px/1 var(--mono);font-style:normal;color:var(--text-mute)}
    .cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:20px;padding:18px 20px}
    @media (max-width:960px){
      .row{grid-template-columns:14px minmax(0,1fr) auto;
           grid-template-areas:"n title price" "n meta tag";row-gap:3px;padding:11px 14px}
      .row .r-new{grid-area:n} .row .r-date{grid-area:meta;font-size:11.5px;color:var(--text-dim)}
      .row .r-title{grid-area:title} .row .r-place{grid-area:meta;justify-self:end;font-size:11.5px}
      .row .r-price{grid-area:price} .row .r-tag{grid-area:tag;justify-self:end} .row .r-act{display:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brandrow">
        <span class="wordmark">frontrow<b>.</b></span>
        <span class="label">shared list</span>
        <span class="role" style="margin-left:auto">read-only</span>
      </div>
      <h1 id="heading" style="margin:18px 0 6px;font:700 30px/1.15 var(--ui)">Loading…</h1>
      <span class="status" id="subhead"></span>
      <blockquote class="note" id="note" hidden></blockquote>
    </div>

    <div id="content"></div>

    <div class="cta panel" id="cta" hidden>
      <div style="display:flex;flex-direction:column;gap:3px;flex:1 1 240px">
        <span style="font:600 15px/1.3 var(--ui)">Like keeping a list like this?</span>
        <span class="prose" style="font-size:13px;color:var(--text-dim)">Frontrow is invite-only — but this is what it looks like.</span>
      </div>
      <a class="btn btn-primary" href="/">Get your own Frontrow ↗</a>
    </div>
  </div>

  <script>
    "use strict";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : null;
    const WD = ["SO","MO","DI","MI","DO","FR","SA"];
    const MO = ["JAN","FEB","MRZ","APR","MAI","JUN","JUL","AUG","SEP","OKT","NOV","DEZ"];
    const pad = n => String(n).padStart(2, "0");
    const dateLine = iso => {
      if (!iso) return "DATE TBA";
      const d = new Date(iso); if (isNaN(d)) return "DATE TBA";
      return `${WD[d.getDay()]} ${pad(d.getDate())} ${MO[d.getMonth()]} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const placeLine = e => [e.venue, e.city].filter(Boolean).join(" · ") || "Venue TBA";
    const AVAIL = {
      sold_out:    { label: "sold out",   tone: "gone" },
      cancelled:   { label: "cancelled",  tone: "alert" },
      unavailable: { label: "no tickets", tone: "gone" },
    };
    const money = e => e.price == null ? null : new Intl.NumberFormat(undefined,
      { style: "currency", currency: e.currency || "EUR" }).format(e.price);
    const monogram = (name, image, size) => {
      const u = safeUrl(image);
      const style = `width:${size}px;height:${size}px;font-size:${Math.round(size * .34)}px`;
      if (u) return `<span class="mono-circle" style="${style}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" /></span>`;
      const ini = (name || "?").replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean)
        .slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
      return `<span class="mono-circle" style="${style}">${esc(ini)}</span>`;
    };

    (function theme() {
      document.documentElement.dataset.frTheme =
        matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    })();

    function rowHTML(e) {
      const av = AVAIL[e.availability], link = safeUrl(e.link), price = money(e);
      return `<div class="row${av ? " is-gone" : ""}">
        ${e.attending ? `<span class="r-new" style="background:var(--held)" title="Ticket bought"></span>` : `<span></span>`}
        <span class="r-date">${esc(dateLine(e.start_date))}</span>
        <span class="r-title" title="${esc(e.name || e.artist)}">${esc(e.name || e.artist)}</span>
        <span class="r-place" title="${esc(placeLine(e))}">${esc(placeLine(e))}</span>
        <span class="r-price">${price ? esc(price) : ""}</span>
        <span class="r-tag"><span class="tag ${av ? av.tone : ""}">${av ? esc(av.label) : "available"}</span></span>
        <span class="r-act">${link
          ? `<a class="btn btn-ghost btn-pill btn-sm" href="${esc(link)}" target="_blank" rel="noopener">${av ? "Event page" : "Tickets"} ↗</a>`
          : ""}</span>
      </div>`;
    }

    function groupHTML(artist, events, image) {
      return `<div class="panel group" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:12px;padding:14px 20px">
          ${monogram(artist, image, 38)}
          <span class="g-name" style="font:700 21px/1 var(--ui)">${esc(artist)}</span>
          <span class="g-sum" style="font:400 11px/1 var(--mono);color:var(--text-dim)">${events.length} show${events.length === 1 ? "" : "s"}</span>
        </div>
        ${events.map(rowHTML).join("")}
      </div>`;
    }

    function state(h, sub) {
      return `<div class="panel empty"><h4>${esc(h)}</h4><p>${esc(sub)}</p></div>`;
    }

    const token = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");

    fetch("/api/shared/" + encodeURIComponent(token)).then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(data => {
      document.getElementById("heading").textContent = `${data.owner_name} is watching these shows`;
      document.getElementById("subhead").textContent = data.concerts.length
        ? `${data.concerts.length} upcoming · updated automatically · ${data.list_name}`
        : data.list_name;
      if (data.note) {
        const q = document.getElementById("note");
        // textContent, not innerHTML — this is an unauthenticated page.
        q.textContent = `“${data.note}”`;
        const cite = document.createElement("cite");
        cite.textContent = `— ${data.owner_name}`;
        q.appendChild(cite);
        q.hidden = false;
      }
      const byArtist = new Map();
      for (const e of data.concerts) {
        if (!byArtist.has(e.artist)) byArtist.set(e.artist, []);
        byArtist.get(e.artist).push(e);
      }
      document.getElementById("content").innerHTML = data.concerts.length
        ? [...byArtist.entries()].map(([a, evs]) => groupHTML(a, evs, evs[0].artist_image)).join("")
        : state("Nothing here yet", `${data.owner_name}'s list is empty right now — check back after the next show drop.`);
      document.getElementById("cta").hidden = false;
    }).catch(() => {
      document.getElementById("heading").textContent = "This link was revoked";
      document.getElementById("subhead").textContent = "";
      document.getElementById("content").innerHTML =
        state("Nothing to see here", "The person who shared it turned it off. Ask them for a fresh one.");
      document.getElementById("cta").hidden = false;
    });
  </script>
</body>
</html>
