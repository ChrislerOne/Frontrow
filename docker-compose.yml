services:
  # Writes the invite list from the FRONTROW_ALLOWED_EMAILS env var into a file that
  # oauth2-proxy reads, then exits. This exists because Coolify's `content:` mount does
  # NOT reliably interpolate env vars (it wrote the literal string "${FRONTROW_...}"),
  # so we materialize the file ourselves with a shell. The env var stays the single
  # source of truth, managed in Coolify (multiline, one email per line).
  oauth2-emails-init:
    image: busybox:1.37
    restart: "no"
    environment:
      - FRONTROW_ALLOWED_EMAILS=${FRONTROW_ALLOWED_EMAILS}
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' "$$FRONTROW_ALLOWED_EMAILS" | tr ',' '\n' | sed '/^[[:space:]]*$$/d' > /shared/emails.txt
        echo "allowlist written: $$(grep -c @ /shared/emails.txt) email(s)"
    volumes:
      - oauth2-emails:/shared

  # The landing + access-denied templates live in the repo (frontend/auth) and therefore
  # in the app image. This copies them into a volume the proxy can mount, then exits.
  # Same build context as the app, so it's a cache hit, not a second image build.
  oauth2-templates-init:
    build: .
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp /app/frontend/auth/sign_in.html /app/frontend/auth/error.html /shared/
        echo "templates published: $$(ls /shared | tr '\n' ' ')"
    volumes:
      - oauth2-templates:/shared

  # SSO gate: Google login, invite-only via the allowlist file above. Proxies to the
  # app only after auth, so the app itself needs no auth code.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true                       # trust Traefik's X-Forwarded-* headers
      - --provider=google
      - --upstream=http://concert-tracker:8000     # the app, internal network only
      - --redirect-url=https://frontrow.lewerenz.app/oauth2/callback
      - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt
      - --cookie-secure=true
      - --cookie-expire=168h
      # Branded landing (sign_in.html) + access-denied (error.html). This is why
      # --skip-provider-button is NOT set: skipping the button jumps straight to Google
      # and the landing page would never render. Missing template files fall back to
      # oauth2-proxy's defaults per file, so a broken mount degrades instead of failing.
      - --custom-templates-dir=/etc/frontrow-templates
      # Public, unauthenticated read-only share pages (+ the CSS they need):
      - --skip-auth-route=^/s/
      - --skip-auth-route=^/api/shared/
      - --skip-auth-route=^/signal.css
    environment:
      # Set these in Coolify's Environment Variables (NOT committed):
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
    volumes:
      - oauth2-emails:/etc/oauth2-proxy:ro         # emails.txt materialized by the init container
      # Branded sign_in/error templates, published out of the app image by
      # oauth2-templates-init. A relative bind mount to ./frontend/auth does NOT work
      # here: Coolify builds from a temp checkout and only keeps the compose file next
      # to the app dir, so the mount resolved to an empty directory.
      - oauth2-templates:/etc/frontrow-templates:ro
    expose:
      - "4180"
    # No healthcheck: distroless image (no shell/curl/wget); a failing probe would make
    # Traefik stop routing. Startup is gated on the app being healthy + the init done.
    depends_on:
      oauth2-emails-init:
        condition: service_completed_successfully
      oauth2-templates-init:
        condition: service_completed_successfully
      concert-tracker:
        condition: service_healthy

  concert-tracker:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/tracker.db
    volumes:
      - concert-data:/data       # persists the SQLite DB across redeploys
    expose:
      - "8000"                   # internal only; only oauth2-proxy reaches it
    # Liveness probe via python3/urllib (no curl needed); hits "/" so it skips the DB.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=4).getcode()==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s

volumes:
  concert-data:
  oauth2-emails:
  oauth2-templates:
