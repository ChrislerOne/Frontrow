services:
  concert-tracker:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/tracker.db
    volumes:
      - concert-data:/data       # persists the SQLite DB across redeploys
    expose:
      - "8000"                   # reachable only via Coolify's proxy (domain + SSL + Basic Auth), not published on the host

volumes:
  concert-data:
