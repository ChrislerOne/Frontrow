services:
  # SSO gate: Google login, invite-only via an email allowlist. Sits in front of
  # the app and proxies to it only after auth. All requests (UI + API) pass through
  # here, so the app itself needs no auth code.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true                       # trust Traefik's X-Forwarded-* headers
      - --provider=google
      - --upstream=http://concert-tracker:8000     # the app, reachable only on the internal network
      - --redirect-url=https://frontrow.lewerenz.app/oauth2/callback
      - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt  # invite list (from FRONTROW_ALLOWED_EMAILS, see volumes)
      - --cookie-secure=true
      - --cookie-expire=168h
      - --skip-provider-button=true                # straight to Google, no interstitial
    environment:
      # Set these in Coolify's Environment Variables (NOT committed):
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      # The invite list: a multiline Coolify env var, one email per line. Not git.
      - FRONTROW_ALLOWED_EMAILS=${FRONTROW_ALLOWED_EMAILS}
    volumes:
      # Coolify's `content:` extension writes the allowlist file from the env var
      # above at deploy time. Change the list = edit the env var in Coolify + redeploy.
      - type: bind
        source: ./oauth2-emails.txt
        target: /etc/oauth2-proxy/emails.txt
        content: |
          ${FRONTROW_ALLOWED_EMAILS}
    expose:
      - "4180"
    # No healthcheck on purpose: this image is distroless (no shell/curl/wget), so a
    # healthcheck command can't run. A *failing* healthcheck would make Traefik stop
    # routing (site down). Instead we gate startup on the app being healthy, below.
    depends_on:
      concert-tracker:
        condition: service_healthy

  concert-tracker:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/tracker.db
    volumes:
      - concert-data:/data       # persists the SQLite DB across redeploys
    expose:
      - "8000"                   # internal only; only oauth2-proxy reaches it now
    # Liveness probe. The Playwright image ships python3, so we probe with urllib
    # (no curl needed). Hits "/" (static index) so it doesn't touch the DB.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=4).getcode()==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s

volumes:
  concert-data:
